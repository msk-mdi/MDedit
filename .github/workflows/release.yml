name: Release

# Push a tag like v0.9.0 to build, sign, notarize and publish a DMG.
#
# Signing needs these repository secrets; without them the DMG is ad-hoc
# signed, which macOS will only open after right-click ▸ Open.
#   DEVELOPER_ID_P12           base64 of the "Developer ID Application" .p12
#   DEVELOPER_ID_P12_PASSWORD  its password
#   DEVELOPER_ID_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD  (an app-specific password)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number is the commit count

      - name: Check the tag matches the app version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Info.plist $version"; exit 1; }

      - name: Test
        run: swift test

      - name: Bundle KaTeX and Mermaid
        run: Scripts/fetch-vendor.sh

      - name: Import the signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials mdedit-notary --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$keychain"
          echo "MDEDIT_SIGN_IDENTITY=${{ secrets.DEVELOPER_ID_IDENTITY }}" >> "$GITHUB_ENV"
          echo "MDEDIT_NOTARY_PROFILE=mdedit-notary" >> "$GITHUB_ENV"

      - name: Build the app and the disk image
        run: |
          Scripts/make-app.sh release
          Scripts/make-dmg.sh | tee build/checksum.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section of CHANGELOG.md for this version is the release notes.
          awk -v v="$version" '/^## /{ if (found) exit; if (index($0, "[" v "]")) found=1; next } found' CHANGELOG.md > build/notes.md
          gh release create "$GITHUB_REF_NAME" "build/MdEdit-$version.dmg" \
            --title "MdEdit $version" --notes-file build/notes.md \
            $([ "$HAS_SIGNING" = true ] || echo --prerelease)
