name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 26 for the Liquid Glass APIs; its default Xcode is 26.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Toolchain
        run: Scripts/ci.sh toolchain

      - name: Build
        run: Scripts/ci.sh build

      - name: Test
        run: Scripts/ci.sh test

      - name: Lint
        run: Scripts/lint.sh

      - name: Assemble the app
        run: Scripts/make-app.sh release --sandbox

      - name: Assemble the app for Intel Macs
        run: MDEDIT_SWIFT_FLAGS="--arch x86_64" Scripts/make-app.sh release --sandbox
